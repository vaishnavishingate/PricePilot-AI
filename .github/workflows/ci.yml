name: PricePilot AI CI

on:
  push:
    branches: ["vaishnavi-shingate", "main", "master"]
  pull_request:
    branches: ["vaishnavi-shingate", "main", "master"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PricePilot-AI_Vaishnavi_Shingate/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: PricePilot-AI_Vaishnavi_Shingate/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PricePilot-AI_Vaishnavi_Shingate/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: PricePilot-AI_Vaishnavi_Shingate/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
